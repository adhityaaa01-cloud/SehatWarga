{% extends "base.html" %}

{% block title %}400 Permintaan Tidak Valid - SehatWarga{% endblock %}

{% block content %}
<div class="container dashboard-wrapper">
  <div class="error-box">
    <div class="error-code">400</div>
    <h2 class="error-title">Permintaan Tidak Dapat Diproses</h2>
    <p class="error-message">Permintaan yang dikirim tidak valid atau parameter yang diberikan tidak sesuai dengan ketentuan sistem.</p>
    <div class="flex justify-center gap-3">
      <a href="{{ url_for('main.index') }}" class="btn btn-primary btn-rounded">Kembali ke Beranda</a>
    </div>
  </div>
</div>
{% endblock %}
